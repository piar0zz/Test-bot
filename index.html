<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Анонимные Вопросы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #1a1d24;
      --accent: linear-gradient(135deg, #FF512F 0%, #DD2476 100%);
      --text-main: #ffffff;
      --text-sub: #8e95a5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
    .avatar-box { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 10px 25px rgba(221, 36, 118, 0.4); }
    .card { background: var(--card-bg); border-radius: 24px; padding: 20px; width: 100%; border: 1px solid rgba(255,255,255,0.05); }
    .title { font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 14px; }
    textarea { width: 100%; height: 110px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; color: #fff; font-size: 15px; resize: none; outline: none; }
    textarea:focus { border-color: #DD2476; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; background: var(--accent); color: white; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; }
    .status { display: none; padding: 10px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 600; width: 100%; }
    .success { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .error { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar-box">🥷</div>
    <div class="card">
      <div class="title" id="cardTitle">Задай мне анонимный вопрос 🤫</div>
      <textarea id="msgInput" placeholder="Напиши всё, что думаешь..." maxlength="300"></textarea>
      <button class="btn" id="sendBtn" onclick="sendQuestion()">Отправить анонимно 🔥</button>
    </div>
    <div id="statusBox" class="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // ЗАМЕНИ НА СВОЙ URL БЭКЕНДА (например, ngrok или боевой сервер)
    const BACKEND_URL = "https://YOUR_BACKEND_URL.ngrok-free.app/send_question";

    const urlParams = new URLSearchParams(window.location.search);
    let targetUserId = tg.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam');

    if (!targetUserId) {
      document.getElementById('cardTitleinnerText = "⚠️ Ссылка недействительна";';
      document.getElementById('msgInput').disabled = true;
      document.getElementById('sendBtn').disabled = true;
    }

    async function sendQuestion() {
      const input = document.getElementById('msgInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();

      if (!text) {
        tg.HapticFeedback.notificationOccurred('error');
        return;
      }

      btn.disabled = true;
      btn.innerText = "Отправка...";

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            target_id: targetUserId,
            sender_id: tg.initDataUnsafe?.user?.id || 0,
            question: text
          })
        });

        const data = await response.json();
        if (response.ok) {
          tg.HapticFeedback.notificationOccurred('success');
          showStatus("✅ Вопрос успешно отправлен!", "success");
          input.value = "";
          setTimeout(() => tg.close(), 2000);
        } else {
          throw new Error(data.reason || "Ошибка");
        }
      } catch (err) {
        tg.HapticFeedback.notificationOccurred('error');
        showStatus("❌ " + (err.message || "Ошибка отправки"), "error");
        btn.disabled = false;
        btn.innerText = "Отправить анонимно 🔥";
      }
    }

    function showStatus(text, className) {
      const box = document.getElementById('statusBox');
      box.className = `status ${className}`;
      box.innerText = text;
      box.style.display = "block";
    }
  </script>
</body>
</html>
