<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Анонимные Вопросы & Квесты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07080a;
      --card: rgba(22, 25, 33, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: linear-gradient(135deg, #FF2E7E 0%, #7928CA 100%);
      --text: #ffffff;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }

    body { 
      background-color: var(--bg); 
      background-image: radial-gradient(circle at 10% 20%, rgba(121, 40, 202, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(255, 46, 126, 0.15) 0%, transparent 40%);
      color: var(--text); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      padding: 16px; 
      padding-bottom: 90px; 
    }

    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

    /* Баланс монет в шапке */
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px 16px; border-radius: 16px; border: 1px solid var(--card-border); }
    .balance-badge { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #fbbf24; font-size: 14px; }

    /* Навигация */
    .nav-tabs { display: flex; width: 100%; background: var(--card); backdrop-filter: blur(20px); border-radius: 20px; padding: 4px; border: 1px solid var(--card-border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .tab { flex: 1; text-align: center; padding: 10px 4px; font-size: 11px; font-weight: 600; color: var(--text-sub); cursor: pointer; border-radius: 16px; transition: all 0.3s; }
    .tab.active { background: var(--accent); color: white; box-shadow: 0 4px 20px rgba(255, 46, 126, 0.4); }

    .view { display: none; width: 100%; flex-direction: column; gap: 16px; animation: fadeIn 0.3s ease; }
    .view.active { display: flex; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card { background: var(--card); backdrop-filter: blur(20px); border-radius: 28px; padding: 24px; width: 100%; border: 1px solid var(--card-border); box-shadow: 0 16px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; gap: 14px; }
    
    .profile-header { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 0 30px rgba(255, 46, 126, 0.4); border: 2px solid rgba(255,255,255,0.2); }
    .title { font-size: 18px; font-weight: 700; text-align: center; }
    .subtitle { font-size: 13px; color: var(--text-sub); text-align: center; }

    textarea { width: 100%; height: 110px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px; color: #fff; font-size: 15px; outline: none; resize: none; transition: all 0.3s; }
    textarea:focus { border-color: #FF2E7E; box-shadow: 0 0 15px rgba(255, 46, 126, 0.2); }

    .btn { width: 100%; padding: 15px; border: none; border-radius: 20px; background: var(--accent); color: white; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 25px rgba(255, 46, 126, 0.4); transition: transform 0.2s; }
    .btn:active { transform: scale(0.97); }

    .btn-secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid var(--card-border); margin-top: 6px; box-shadow: none; }

    .link-box { background: rgba(0,0,0,0.4); padding: 12px 16px; border-radius: 14px; font-size: 13px; color: #a5b4fc; word-break: break-all; border: 1px dashed rgba(255,255,255,0.1); text-align: center; }

    /* Квесты и карточки */
    .quest-card { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 14px 16px; border-radius: 18px; border: 1px solid var(--card-border); }
    .quest-info h4 { font-size: 14px; font-weight: 600; }
    .quest-info p { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .claim-btn { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .claim-btn.done { background: rgba(255,255,255,0.1); color: var(--text-sub); cursor: default; }

    .qa-card { background: var(--card); border-radius: 24px; padding: 20px; width: 100%; border: 1px solid var(--card-border); display: flex; flex-direction: column; gap: 10px; }
    .q-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #FF2E7E; }
    .q-text { font-size: 14px; color: var(--text-sub); }
    .a-text { font-size: 16px; font-weight: 600; color: #fff; line-height: 1.4; }

    .status { padding: 12px; border-radius: 16px; text-align: center; font-size: 13px; font-weight: 600; width: 100%; display: none; }
    .success { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Шапка с балансом монет -->
    <div class="top-bar">
      <span style="font-size: 13px; font-weight: 600; color: var(--text-sub);">Твой профиль 🥷</span>
      <div class="balance-badge">
        <span>✨</span> <span id="userCoins">150</span> монет
      </div>
    </div>

    <!-- Навигация (5 вкладок) -->
    <div class="nav-tabs">
      <div class="tab active" onclick="switchTab('main')" id="tab-btn-main">Главная</div>
      <div class="tab" onclick="switchTab('inbox')" id="tab-btn-inbox">Инбокс 📥</div>
      <div class="tab" onclick="switchTab('wall')" id="tab-btn-wall">Стена 🏛</div>
      <div class="tab" onclick="switchTab('quests')" id="tab-btn-quests">Квесты 🎯</div>
      <div class="tab" onclick="switchTab('store')" id="tab-btn-store">Магазин ⭐️</div>
    </div>

    <!-- Вкладка 1: Главная (Кабинет ИЛИ Отправка другу) -->
    <div class="view active" id="view-main">
      <div class="card" id="mainCardContent">
        <!-- Динамически заполняется скриптом -->
      </div>
      <div id="statusBox" class="status"></div>
    </div>

    <!-- Вкладка 2: Инбокс -->
    <div class="view" id="view-inbox">
      <div id="inboxList" style="width: 100%; display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <!-- Вкладка 3: Стена ответов -->
    <div class="view" id="view-wall">
      <div id="wallList" style="width: 100%; display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <!-- Вкладка 4: Квесты и Задания (Геймификация и награды) -->
    <div class="view" id="view-quests">
      <div class="title" style="text-align: left; margin-bottom: 2px;">Ежедневные квесты 🎯</div>
      <div class="subtitle" style="text-align: left; margin-bottom: 6px;">Выполняй задания и забирай монеты!</div>
      
      <div id="questsList" style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
        <!-- Динамически рендерится -->
      </div>
    </div>

    <!-- Вкладка 5: Магазин -->
    <div class="view" id="view-store">
      <div class="title" style="text-align: left; margin-bottom: 4px;">Магазин наград ⭐️</div>
      <div class="subtitle" style="text-align: left; margin-bottom: 10px;">Трать монеты или звезды</div>
      
      <div class="quest-card">
        <div class="quest-info">
          <h4>🕵️‍♂️ Раскрыть автора</h4>
          <p>Узнай, кто прислал анонимку</p>
        </div>
        <button class="claim-btn" style="background:#3b82f6;" onclick="buyItem(50)">50 монет</button>
      </div>
      <div class="quest-card" style="margin-top: 8px;">
        <div class="quest-info">
          <h4>👑 Золотой статус</h4>
          <p>Корона и премиум рамка</p>
        </div>
        <button class="claim-btn" style="background:#3b82f6;" onclick="buyItem(150)">150 монет</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const myUserId = tg.initDataUnsafe?.user?.id || 12345;
    const urlParams = new URLSearchParams(window.location.search);
    let targetUserId = tg.initDataUnsafe?.start_param || urlParams.get('tgWebAppStartParam');

    // Данные в localStorage для динамики
    let userCoins = parseInt(localStorage.getItem('coins')) || 150;
    document.getElementById('userCoins').innerText = userCoins;

    let inboxData = JSON.parse(localStorage.getItem('inbox')) || [
      { id: 1, text: "Кто твоя главная краш в офисе?" },
      { id: 2, text: "Какая твоя самая безумная мечта?" }
    ];
    
    let wallData = JSON.parse(localStorage.getItem('wall')) || [
      { q: "Любимый сериал?", a: "Твое молчание по вечерам 😉" }
    ];

    let questsData = JSON.parse(localStorage.getItem('quests')) || [
      { id: 1, title: "Задай 3 вопроса друзьям", reward: 30, progress: 1, target: 3, done: false },
      { id: 2, title: "Опубликуй 2 ответа на стене", reward: 50, progress: 0, target: 2, done: false },
      { id: 3, title: "Поделись ссылкой в сторис", reward: 40, progress: 0, target: 1, done: false }
    ];

    function updateCoins(amount) {
      userCoins += amount;
      localStorage.setItem('coins', userCoins);
      document.getElementById('userCoins').innerText = userCoins;
    }

    // Рендер главного экрана (Личный кабинет ИЛИ отправка другу)
    function renderMainScreen() {
      const container = document.getElementById('mainCardContent');
      
      if (!targetUserId || targetUserId == myUserId) {
        const myLink = `https://t.me/your_bot_name/app?startapp=${myUserId}`;
        container.innerHTML = `
          <div class="profile-header">
            <div class="avatar">👑</div>
            <div class="title">Твой личный кабинет</div>
            <div class="subtitle">Приглашай друзей и собирай вопросы!</div>
          </div>
          <div class="link-box">${myLink}</div>
          <button class="btn" onclick="copyMyLink('${myLink}')">📋 Скопировать ссылку</button>
          <button class="btn btn-secondary" onclick="shareToFriendsDirectly()">🚀 Отправить друзьям в чат</button>
        `;
      } else {
        container.innerHTML = `
          <div class="profile-header">
            <div class="avatar">🥷</div>
            <div class="title">Задай анонимный вопрос</div>
            <div class="subtitle">Получатель не узнает, кто ты 🔒</div>
          </div>
          <textarea id="msgInput" placeholder="Напиши всё, что думаешь..." maxlength="300"></textarea>
          <button class="btn" id="sendBtn" onclick="sendQuestion()">Отправить анонимно 🔥</button>
        `;
      }
    }

    function copyMyLink(link) {
      navigator.clipboard.writeText(link);
      tg.HapticFeedback.notificationOccurred('success');
      alert("Ссылка скопирована!");
    }

    // 🔥 Прямая отправка друзьям находясь ВНУТРИ миниапа (Telegram WebApp API)
    function shareToFriendsDirectly() {
      const myLink = `https://t.me/your_bot_name/app?startapp=${myUserId}`;
      const text = encodeURIComponent("Задай мне анонимный вопрос в Telegram! 🤫👇\n" + myLink);
      // Открывает нативный диалог выбора чата/друга в Telegram
      window.open(`https://t.me/share/url?url=${encodeURIComponent(myLink)}&text=${text}`);
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      document.getElementById(`tab-btn-${tabName}`).classList.add('active');
      document.getElementById(`view-${tabName}`).classList.add('active');

      if (tabName === 'inbox') loadInbox();
      if (tabName === 'wall') loadWall();
      if (tabName === 'quests') loadQuests();
    }

    async function sendQuestion() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) { tg.HapticFeedback.notificationOccurred('error'); return; }

      tg.HapticFeedback.notificationOccurred('success');
      alert("✅ Вопрос успешно отправлен анонимно!");
      input.value = "";
      
      // Прогресс квеста (задание: задать вопросы)
      updateQuestProgress(1);
    }

    function loadInbox() {
      const list = document.getElementById('inboxList');
      if (inboxData.length === 0) {
        list.innerHTML = `<div class="card" style="text-align: center; color: var(--text-sub);">📭 Входящих вопросов пока нет</div>`;
        return;
      }
      list.innerHTML = "";
      inboxData.forEach((item) => {
        list.innerHTML += `
          <div class="card">
            <div class="q-badge">Входящий</div>
            <div class="q-text" style="font-size: 15px; color: #fff;">«${item.text}»</div>
            <textarea placeholder="Напиши ответ..." id="ans_${item.id}" style="height:80px;"></textarea>
            <button class="btn" onclick="publishAnswer(${item.id}, '${item.text}')">Опубликовать на Стене 🔥</button>
          </div>`;
      });
    }

    function publishAnswer(id, qText) {
      const ansInput = document.getElementById(`ans_${id}`);
      const aText = ansInput.value.trim();
      if (!aText) { alert("Напиши ответ!"); return; }

      wallData.unshift({ q: qText, a: aText });
      localStorage.setItem('wall', JSON.stringify(wallData));

      inboxData = inboxData.filter(item => item.id !== id);
      localStorage.setItem('inbox', JSON.stringify(inboxData));

      updateCoins(10); // Бонус монет за ответ
      updateQuestProgress(2); // Прогресс квеста на ответы

      tg.HapticFeedback.notificationOccurred('success');
      alert("🎉 Ответ опубликован! +10 монет ✨");
      switchTab('wall');
    }

    function loadWall() {
      const wall = document.getElementById('wallList');
      if (wallData.length === 0) {
        wall.innerHTML = `<div class="card" style="text-align: center; color: var(--text-sub);">🏛 На стене пока нет ответов</div>`;
        return;
      }
      wall.innerHTML = "";
      wallData.forEach(item => {
        wall.innerHTML += `
          <div class="qa-card">
            <div class="q-badge">Вопрос</div>
            <div class="q-text">«${item.q}»</div>
            <div class="a-text">💬 ${item.a}</div>
            <button class="btn" style="padding: 10px; font-size: 13px; margin-top: 6px; background: rgba(255,255,255,0.1);" onclick="shareToStory()">
              🚀 Поделиться в истории Telegram
            </button>
          </div>`;
      });
    }

    // Загрузка квестов
    function loadQuests() {
      const list = document.getElementById('questsList');
      list.innerHTML = "";
      questsData.forEach(q => {
        const isReady = q.progress >= q.target && !q.done;
        list.innerHTML += `
          <div class="quest-card">
            <div class="quest-info">
              <h4>${q.title}</h4>
              <p>Прогресс: ${q.progress}/${q.target} • Награда: +${q.reward} монет</p>
            </div>
            <button class="claim-btn ${q.done ? 'done' : ''}" ${isReady && !q.done ? `onclick="claimQuest(${q.id})"` : ''}>
              ${q.done ? 'Выполнено' : (isReady ? 'Забрать' : 'В процессе')}
            </button>
          </div>`;
      });
    }

    function updateQuestProgress(questId) {
      questsData.forEach(q => {
        if (q.id === questId && !q.done) {
          q.progress = Math.min(q.target, q.progress + 1);
        }
      });
      localStorage.setItem('quests', JSON.stringify(questsData));
    }

    function claimQuest(questId) {
      questsData.forEach(q => {
        if (q.id === questId && !q.done) {
          q.done = true;
          updateCoins(q.reward);
          tg.HapticFeedback.notificationOccurred('success');
          alert(`🎁 Награда получена! +${q.reward} монет ✨`);
        }
      });
      localStorage.setItem('quests', JSON.stringify(questsData));
      loadQuests();
    }

    function buyItem(cost) {
      if (userCoins >= cost) {
        updateCoins(-cost);
        tg.HapticFeedback.notificationOccurred('success');
        alert("✅ Успешно приобретено!");
      } else {
        tg.HapticFeedback.notificationOccurred('error');
        alert("❌ Не хватает монет! Выполняй квесты.");
      }
    }

    function shareToStory() {
      if (tg.isVersionAtLeast('7.8')) {
        tg.shareToStory("https://telegra.ph/file/example.png", {
          text: "Задай мне анонимный вопрос! 👇",
          widget_link: { url: `https://t.me/bot/app`, name: "Задать вопрос 🤫" }
        });
      } else {
        updateQuestProgress(3); // Засчитываем квест сторис
        alert("Карточка готова к публикации в истории! Квест засчитан.");
      }
    }

    renderMainScreen();
  </script>
</body>
</html>
